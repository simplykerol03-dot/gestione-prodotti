<aside class="sidebar bg-dark text-white d-flex flex-column">
  <div class="sidebar-brand d-flex align-items-center px-3 fw-semibold border-bottom border-secondary">
    <i class="bi bi-boxes me-2"></i> Gestione Prodotti
  </div>

  <ul class="nav nav-pills flex-column p-2 gap-1">
    @for (item of menu; track item.path) {
      <li class="nav-item">
        <a class="nav-link text-white"
           [routerLink]="item.path"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: item.exact }">
          <i class="bi me-2" [class]="item.icon"></i>{{ item.label }}
        </a>
      </li>
    }
  </ul>
</aside>
